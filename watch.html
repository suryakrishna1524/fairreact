<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FairReact - Universal Dual Sync Player</title>
  
  <!-- Google AdSense Verification & Auto-Ads Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3037836364890819"
     crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/player.css?v=2.9.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="fr-cinema-body">
  <!-- Drag Blocker Overlay -->
  <div class="fr-drag-overlay" id="drag-overlay"></div>

  <!-- Workspace Viewport (Full 100vw x 100vh Cinema Stage) -->
  <main class="fr-viewport" id="fr-viewport">
    <!-- Top Left FairReact Logo Watermark -->
    <a href="index.html" class="fr-cinema-brand" id="cinema-brand" title="FairReact Universal Player">
      <div class="fr-web-logo">FR</div>
      <span class="fr-cinema-brand-title">FairReact</span>
    </a>

    <!-- Big Play Overlay for Instant Mobile Activation -->
    <div class="fr-big-play-overlay" id="big-play-overlay">
      <button class="fr-big-play-btn" id="btn-big-play" aria-label="Start Watching">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <span class="fr-big-play-text">Tap to Play Reaction</span>
    </div>

    <!-- Main Reaction Player Container -->
    <div class="fr-main-player-box" id="main-player-box">
      <div id="main-player"></div>
      <!-- Click / Tap Interaction Shield -->
      <div class="fr-video-tap-shield" id="video-tap-shield"></div>
    </div>

    <!-- Custom Cinema Controls Bar (Works 100% on Desktop & Mobile with Auto-Hide) -->
    <div class="fr-cinema-controls" id="cinema-controls">
      <!-- Scrubber / Progress Bar -->
      <div class="fr-scrubber-track" id="main-scrubber" title="Seek video">
        <div class="fr-scrubber-buffered" id="main-buffered"></div>
        <div class="fr-scrubber-fill" id="main-progress-fill"></div>
        <div class="fr-scrubber-thumb" id="main-progress-thumb"></div>
      </div>

      <!-- Controls Row -->
      <div class="fr-ctrl-row">
        <div class="fr-ctrl-left">
          <!-- Play / Pause -->
          <button class="fr-ctrl-btn" id="btn-cinema-play" title="Play/Pause (Space)">▶</button>

          <!-- Volume & Mute -->
          <div class="fr-cinema-vol">
            <button class="fr-ctrl-btn" id="btn-cinema-mute" title="Mute/Unmute">🔊</button>
            <input type="range" id="cinema-vol-slider" min="0" max="100" value="100" title="Reactor Volume">
          </div>

          <!-- Time Display -->
          <span class="fr-time-display" id="cinema-time-txt">00:00 / 00:00</span>
        </div>

        <div class="fr-ctrl-right">
          <!-- CC Subtitles Toggle -->
          <button class="fr-ctrl-btn" id="btn-cinema-cc" title="Subtitles / Captions">CC</button>

          <!-- Playback Speed Menu -->
          <div class="fr-menu-container">
            <button class="fr-ctrl-btn" id="btn-cinema-speed" title="Playback Speed">1x</button>
            <div class="fr-popup-menu" id="menu-speed">
              <button class="fr-menu-item" data-speed="0.5">0.5x</button>
              <button class="fr-menu-item" data-speed="0.75">0.75x</button>
              <button class="fr-menu-item active" data-speed="1.0">1.0x (Normal)</button>
              <button class="fr-menu-item" data-speed="1.25">1.25x</button>
              <button class="fr-menu-item" data-speed="1.5">1.5x</button>
              <button class="fr-menu-item" data-speed="2.0">2.0x</button>
            </div>
          </div>

          <!-- Quality Menu -->
          <div class="fr-menu-container">
            <button class="fr-ctrl-btn" id="btn-cinema-quality" title="Video Quality">⚙️</button>
            <div class="fr-popup-menu" id="menu-quality">
              <button class="fr-menu-item active" data-quality="auto">Auto</button>
              <button class="fr-menu-item" data-quality="hd1080">1080p HD</button>
              <button class="fr-menu-item" data-quality="hd720">720p HD</button>
              <button class="fr-menu-item" data-quality="large">480p</button>
              <button class="fr-menu-item" data-quality="medium">360p</button>
            </div>
          </div>

          <!-- Fullscreen Toggle -->
          <button class="fr-ctrl-btn" id="btn-cinema-fullscreen" title="Toggle Fullscreen (F)">⛶</button>
        </div>
      </div>

      <!-- Google AdSense Non-Intrusive Banner Container (Normal Mode View) -->
      <div class="fr-ad-banner-slot" id="fr-ad-banner">
        <ins class="adsbygoogle"
             style="display:inline-block;width:728px;max-width:100%;height:60px;"
             data-ad-client="ca-pub-3037836364890819"
             data-ad-slot="auto"
             data-ad-format="horizontal"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>

    <!-- Floating PiP Window (Exact Extension Look & Smooth Sync) -->
    <div class="fr-pip-window hidden" id="pip-window">
      <!-- PiP Header -->
      <div class="fr-pip-header" id="pip-header">
        <div class="fr-title-area">
          <span class="fr-logo-badge">Original</span>
          <div class="fr-status-pill fr-status-sync" id="pip-status-pill">
            <span class="fr-status-dot"></span>
            <span id="pip-status-text">Synced</span>
          </div>
        </div>

        <div class="fr-header-actions">
          <button class="fr-btn-icon" id="btn-pip-169" title="Snap to 16:9 Cinema (Zero Black Bars)">16:9</button>
          <button class="fr-btn-icon" id="btn-pip-reload" title="Re-sync frame">🔄</button>
          <button class="fr-btn-icon" id="btn-pip-size" title="Cycle size">📐</button>
          <button class="fr-btn-icon" id="btn-pip-dock" title="Cycle corners">📍</button>
          <button class="fr-btn-icon" id="btn-pip-toggle" title="Close/Hide PiP">✕</button>
        </div>
      </div>

      <!-- PiP Video Container -->
      <div class="fr-pip-stage">
        <div id="pip-player"></div>
        <!-- Touch & Drag Shield on PiP -->
        <div class="fr-pip-click-shield" id="pip-click-shield" title="Touch & Drag to Move"></div>
      </div>

      <!-- PiP Footer Controls -->
      <div class="fr-pip-footer" id="pip-footer">
        <div class="fr-footer-left">
          <button class="fr-btn-nudge" id="btn-reset-offset" title="Reset Drift Offset">0s</button>
        </div>

        <div class="fr-footer-center">
          <button class="fr-btn-nudge" id="btn-m5" title="Rewind 5s">-5s</button>
          <button class="fr-btn-nudge" id="btn-m1" title="Rewind 1s">-1s</button>
          <span class="fr-offset-display" id="pip-offset-txt" title="Current Drift Offset">0.0s</span>
          <button class="fr-btn-nudge" id="btn-p1" title="Forward 1s">+1s</button>
          <button class="fr-btn-nudge" id="btn-p5" title="Forward 5s">+5s</button>
        </div>

        <div class="fr-footer-right">
          <div class="fr-vol-container">
            <button class="fr-btn-icon" id="btn-pip-mute" title="Toggle Mute" style="font-size:12px;padding:2px;">🔊</button>
            <input type="range" class="fr-vol-slider" id="pip-vol-slider" min="0" max="100" value="80" title="PiP Volume">
          </div>
        </div>
      </div>

      <!-- Dedicated Individual Adjusters -->
      <!-- 1. Right Edge (Horizontal Width Only) -->
      <div class="fr-edge-resizer fr-edge-r" id="pip-resize-r" title="Drag to adjust Width (Horizontal)">
        <div class="fr-edge-pill-v"></div>
      </div>
      <!-- 2. Left Edge (Horizontal Width Only) -->
      <div class="fr-edge-resizer fr-edge-l" id="pip-resize-l" title="Drag to adjust Width (Horizontal)">
        <div class="fr-edge-pill-v"></div>
      </div>
      <!-- 3. Bottom Edge (Vertical Height Only) -->
      <div class="fr-edge-resizer fr-edge-b" id="pip-resize-b" title="Drag to adjust Height (Vertical)">
        <div class="fr-edge-pill-h"></div>
      </div>
      <!-- 4. Corner Handles (Diagonal) -->
      <div class="fr-resize-handle fr-resize-se" id="pip-resize-handle" title="Drag Corner to resize"></div>
      <div class="fr-resize-handle fr-resize-sw" id="pip-resize-sw" title="Drag Left Corner to resize"></div>
    </div>
  </main>

  <script src="js/sync_engine.js?v=2.9.0"></script>
  <script src="js/player_app.js?v=2.9.0"></script>
</body>
</html>
